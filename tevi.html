<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Numără țevi</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12161a;--panel:#1c2228;--line:#2d363f;--text:#e8edf1;--mute:#8e9aa6;--acc:#ffb020;--ring:#b6f23a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Barlow,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h1{font:800 22px 'Barlow Condensed',Impact,sans-serif;margin:4px 0 12px;letter-spacing:.3px}
.count{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.count b{font:800 76px/1 'Barlow Condensed',Impact,sans-serif;color:var(--acc)}
.count span{color:var(--mute);font-size:18px}
.btns{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;text-align:center;padding:14px 8px;border-radius:10px;background:var(--acc);color:#1a1200;font-weight:600;border:0;font-size:16px;cursor:pointer}
.btn.sec{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
input[type=file]{display:none}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:120px}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.empty{padding:36px 18px;color:var(--mute);text-align:center}
.busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#12161acc;font-weight:600}
.ctl{margin-top:12px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.hint{color:var(--mute);font-size:14px;margin-top:10px}
.tools{display:flex;gap:8px;margin-top:12px}
.tools .btn{padding:10px 6px;font-size:15px}
</style>
</head>
<body>
<h1>Numără țevi</h1>
<div class="count"><b id="n">0</b><span>țevi</span></div>
<div class="btns">
  <label class="btn">Fă poză<input id="cam" type="file" accept="image/*" capture="environment"></label>
  <label class="btn sec">Din galerie<input id="gal" type="file" accept="image/*"></label>
</div>
<div class="stage">
  <div class="empty" id="empty">Fotografiază capetele țevilor din față, cât mai drept și cu lumină bună.</div>
  <canvas id="cv" hidden></canvas>
  <div class="busy" id="busy">Se numără…</div>
</div>
<div class="ctl" id="ctl" hidden>
  <div class="row"><span>Sensibilitate</span><input id="sens" type="range" min="1" max="10" value="6"></div>
  <div class="row"><span>Mărime țeavă</span><input id="size" type="range" min="0" max="10" value="0"></div>
  <div class="tools">
    <button class="btn sec" id="undo">Anulează</button>
    <button class="btn sec" id="reset">Șterge corecțiile</button>
  </div>
  <div class="hint">Atinge o țeavă marcată ca să o ștergi. Atinge un loc gol ca să adaugi o țeavă. Dacă sunt prea multe sau prea puține cercuri, mișcă „Sensibilitate" și „Mărime țeavă".</div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);
let W=0,H=0,WH=0,rs=[],acc=null,kc=0,det=[],adds=[],rms=[],undo=[];

function load(file){
  if(!file)return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const s=Math.min(1,640/Math.max(img.width,img.height));
    W=Math.round(img.width*s);H=Math.round(img.height*s);WH=W*H;
    cv.width=W;cv.height=H;ctx.drawImage(img,0,0,W,H);URL.revokeObjectURL(url);
    $('empty').hidden=true;cv.hidden=false;$('ctl').hidden=false;
    $('busy').style.display='flex';adds=[];rms=[];undo=[];det=[];
    setTimeout(()=>{analyze();$('busy').style.display='none';detect();},40);
  };
  img.onerror=()=>alert('Nu pot deschide poza.');
  img.src=url;
}
$('cam').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('gal').onchange=e=>{load(e.target.files[0]);e.target.value=''};

function analyze(){
  const d=ctx.getImageData(0,0,W,H).data,g=new Uint8Array(WH),b=new Uint8Array(WH);
  for(let i=0;i<WH;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;
    b[i]=(g[i-W-1]+g[i-W]+g[i-W+1]+g[i-1]+g[i]+g[i+1]+g[i+W-1]+g[i+W]+g[i+W+1])/9;}
  const gx=new Float32Array(WH),gy=new Float32Array(WH),mg=new Float32Array(WH),hist=new Uint32Array(1024);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;
    const a=b[i-W-1],c=b[i-W],e=b[i-W+1],f=b[i-1],h=b[i+1],j=b[i+W-1],k=b[i+W],l=b[i+W+1];
    const sx=(e+2*h+l)-(a+2*f+j),sy=(j+2*k+l)-(a+2*c+e);
    gx[i]=sx;gy[i]=sy;const m=Math.hypot(sx,sy);mg[i]=m;hist[Math.min(1023,m|0)]++;}
  let cum=0,T=1023;const target=WH*0.16;
  for(let v=1023;v>=0;v--){cum+=hist[v];if(cum>=target){T=v;break;}}
  T=Math.max(T,40);
  const rmax=Math.min(110,Math.floor(Math.min(W,H)*.45));
  rs=[];for(let r=6;r<=rmax;r+=2)rs.push(r);
  const nr=rs.length;acc=new Uint16Array(nr*WH);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x,m=mg[i];if(m<T)continue;
    const ux=gx[i]/m,uy=gy[i]/m;
    for(let k=0;k<nr;k++){const r=rs[k];
      let cx=Math.round(x+ux*r),cy=Math.round(y+uy*r);
      if(cx>=0&&cx<W&&cy>=0&&cy<H)acc[k*WH+cy*W+cx]++;
      cx=Math.round(x-ux*r);cy=Math.round(y-uy*r);
      if(cx>=0&&cx<W&&cy>=0&&cy<H)acc[k*WH+cy*W+cx]++;}
  }
  const tmp=new Uint16Array(WH),tot=new Float64Array(nr);
  for(let k=0;k<nr;k++){
    const p=acc.subarray(k*WH,(k+1)*WH);
    for(let y=0;y<H;y++)for(let x=1;x<W-1;x++){const i=y*W+x;tmp[i]=p[i-1]+p[i]+p[i+1];}
    const inv=1/(6.283*rs[k]);let t=0;
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;
      const v=tmp[i-W]+tmp[i]+tmp[i+W];p[i]=v;const s=v*inv-.3;if(s>0)t+=s;}
    tot[k]=t;
  }
  let best=-1;kc=0;
  for(let k=0;k<nr;k++){const s=(tot[k-1]||0)+tot[k]+(tot[k+1]||0);if(s>best){best=s;kc=k;}}
  const sz=$('size');sz.max=nr-1;sz.value=kc;
}

function detect(){
  if(!acc)return;
  const t=.7-.055*(+$('sens').value),k0=+$('size').value,R=rs[k0];
  let lo=0,hi=rs.length-1;
  while(lo<rs.length-1&&rs[lo]<.8*R)lo++;
  while(hi>0&&rs[hi]>1.25*R)hi--;
  const best=new Float32Array(WH),bk=new Uint8Array(WH);
  for(let k=lo;k<=hi;k++){
    const p=acc.subarray(k*WH,(k+1)*WH),inv=1/(6.283*rs[k]);
    for(let i=0;i<WH;i++){const s=p[i]*inv;if(s>best[i]){best[i]=s;bk[i]=k;}}
  }
  const cand=[];for(let i=0;i<WH;i++)if(best[i]>=t)cand.push(i);
  cand.sort((a,b)=>best[b]-best[a]);
  det=[];
  for(const i of cand){
    const x=i%W,y=(i/W)|0,r=rs[bk[i]];let ok=true;
    for(const q of det){const dx=q.x-x,dy=q.y-y,m=1.5*Math.min(r,q.r);
      if(dx*dx+dy*dy<m*m){ok=false;break;}}
    if(ok)det.push({x,y,r});
  }
  render();
}

function items(){
  const out=det.filter(c=>!rms.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<.6*c.r));
  return out.concat(adds);
}
let base=null;
function render(){redraw();}
function redraw(){
  const list=items();
  ctx.putImageData(base,0,0);
  const lw=Math.max(2,W/260);
  list.forEach((c,i)=>{
    ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,6.2832);
    ctx.lineWidth=lw;ctx.strokeStyle=c.m?'#ffb020':'#b6f23a';ctx.stroke();
    ctx.font='600 '+Math.max(10,Math.round(c.r*.7))+'px Barlow,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=3;ctx.strokeStyle='#000a';ctx.strokeText(i+1,c.x,c.y);
    ctx.fillStyle='#fff';ctx.fillText(i+1,c.x,c.y);
  });
  $('n').textContent=list.length;
}

// keep a clean copy of the photo for redraws
const _analyze=analyze;
analyze=function(){base=ctx.getImageData(0,0,W,H);_analyze();};

cv.addEventListener('click',e=>{
  if(!acc)return;
  const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
  const list=items();let hit=null,bd=1e9;
  for(const c of list){const d=Math.hypot(c.x-x,c.y-y);if(d<c.r&&d<bd){bd=d;hit=c;}}
  if(hit){
    if(hit.m){const j=adds.indexOf(hit);adds.splice(j,1);undo.push({t:'unadd',c:hit});}
    else{const p={x:hit.x,y:hit.y};rms.push(p);undo.push({t:'rm',p});}
  }else{
    const c={x,y,r:rs[+$('size').value],m:true};adds.push(c);undo.push({t:'add',c});
  }
  redraw();
});
$('undo').onclick=()=>{
  const u=undo.pop();if(!u)return;
  if(u.t==='add')adds.splice(adds.indexOf(u.c),1);
  else if(u.t==='unadd')adds.push(u.c);
  else rms.splice(rms.indexOf(u.p),1);
  redraw();
};
$('reset').onclick=()=>{adds=[];rms=[];undo=[];redraw();};
$('sens').oninput=detect;$('size').oninput=detect;
</script>
</body>
</html>
