<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Produse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Evidența produselor</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--mut:#6b7280;--ac:#2563eb;--bd:#e5e7eb;--red:#fee2e2;--redb:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1c1f26;--tx:#eceef2;--mut:#9aa1ad;--ac:#5b8def;--bd:#2c313b;--red:#4a1d1d;--redb:#f87171}}
*{box-sizing:border-box}
html,body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
body{padding-bottom:90px}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;font-size:20px;font-weight:700}
header .t{flex:1;min-width:0;overflow-wrap:anywhere}
header button{background:none;border:0;color:var(--ac);font-size:22px;padding:4px 8px}
header .ud{font-size:14px;white-space:nowrap}header .ud:disabled{opacity:.3}
.sub{padding:0 16px 6px;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;padding:0;text-align:left;color:var(--tx);font:inherit}
.sc .ph{aspect-ratio:4/3;background:var(--bd) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:44px}
.sc .in{padding:10px 12px}
.sc b{display:block;font-size:16px;overflow-wrap:anywhere}
.sc small{color:var(--mut)}
.sc .out{color:var(--redb);font-weight:600}
.item{margin:8px 16px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.item.zero{background:var(--red);border-color:var(--redb)}
.top{display:flex;align-items:center;gap:10px}
.nm{flex:1;min-width:0;font-size:17px;overflow-wrap:anywhere;background:none;border:0;color:var(--tx);text-align:left;padding:4px 0;font-weight:600}
.nm small{display:block;color:var(--redb);font-size:12px;font-weight:700}
.qv{font-size:28px;font-weight:700;min-width:64px;text-align:right}.zero .qv{color:var(--redb)}
.man{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--bd)}
.q{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:700;padding:12px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.go{flex:none;padding:0 16px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.b{padding:12px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-weight:600}
.b.p{background:#16a34a;color:#fff;border-color:#16a34a}.b.m{background:#dc2626;color:#fff;border-color:#dc2626}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.add{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:15px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:17px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.md{width:100%;max-width:480px;max-height:90%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.md h3{margin:0 0 12px}
.md label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.md input[type=text]{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.pv{margin-top:6px;aspect-ratio:4/3;max-height:160px;border-radius:12px;background:var(--bd) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.row .ok{background:var(--ac);color:#fff;border-color:var(--ac)}
.row .del{color:var(--redb)}
</style>
</head>
<body>
<header id="hd"></header>
<div class="sub" id="sub"></div>
<div id="main"></div>
<button class="add" id="add"></button>
<div id="modal"></div>
<script>
const KEY='uchet_v1';
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!Array.isArray(S.sections)){S={sections:[]}}}
let last='',stack=[];
function save(){const cur=JSON.stringify(S);if(cur!==last){stack.push(last);if(stack.length>30)stack.shift();last=cur}
 try{localStorage.setItem(KEY,cur)}catch(e){alert('Nu s-a putut salva: spațiu insuficient sau stocare indisponibilă')}}
function undo(){if(!stack.length)return;last=stack.pop();S=JSON.parse(last);try{localStorage.setItem(KEY,last)}catch(e){}route()}
function askQty(it,nq){
 const d=nq-it.qty;if(!d)return;
 const plus=d>0,col=plus?'#16a34a':'#dc2626';
 modal(`<h3>Confirmați modificarea</h3><div style="text-align:center;padding:8px 0"><div style="color:var(--mut)">${esc(it.name)}</div><div style="font-size:44px;font-weight:800;color:${col};line-height:1.2">${plus?'+':'−'}${Math.abs(d)}</div><div style="font-size:18px">Era <b>${it.qty}</b> → devine <b style="color:${col}">${nq}</b></div></div><div class="row"><button id="mCan">Anulare</button><button class="ok" id="mOk" style="background:${col};border-color:${col}">${plus?'Adaugă':'Scade'}</button></div>`,close=>{
  $('mCan').onclick=close;
  $('mOk').onclick=()=>{it.qty=nq;close();save();render()};
 });
}
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d)=>{const n=parseInt(v,10);return isNaN(n)?d:Math.max(0,n)};
let sec=null;
function route(){const m=/^s-(\d+)$/.exec(location.hash.slice(1));sec=m?S.sections.find(s=>s.id==m[1])||null:null;render()}
window.addEventListener('hashchange',route);
function render(){
 if(!sec){
  $('hd').innerHTML=`<span class="t">📦 Secțiuni</span><button class="ud" id="undo" ${stack.length?'':'disabled'}>↶ Anulează</button>`;
  $('sub').textContent=S.sections.length?'':'';
  $('add').textContent='+ Adaugă secțiune';
  $('main').innerHTML=S.sections.length?'<div class="grid">'+S.sections.map(s=>{const out=s.items.filter(i=>i.qty<=0).length;return `<button class="sc" data-id="${s.id}"><div class="ph" ${s.photo?`style="background-image:url(${s.photo})"`:''}>${s.photo?'':'📁'}</div><div class="in"><b>${esc(s.name)}</b><small>Produse: ${s.items.length}</small>${out?`<br><small class="out">Epuizat: ${out}</small>`:''}</div></button>`}).join('')+'</div>':'<div class="empty">Nu există secțiuni încă.<br>Apăsați „Adaugă secțiune”.</div>';
 }else{
  $('hd').innerHTML=`<button id="back">←</button><span class="t">${esc(sec.name)}</span><button class="ud" id="undo" ${stack.length?'':'disabled'}>↶ Anulează</button><button id="secEdit">✎</button>`;
  const out=sec.items.filter(i=>i.qty<=0).length;
  $('sub').textContent=sec.items.length?`Produse: ${sec.items.length}${out?' · epuizat: '+out:''}`:'';
  $('add').textContent='+ Adaugă produs';
  $('main').innerHTML=sec.items.length?sec.items.map(it=>`<div class="item ${it.qty<=0?'zero':''}" data-id="${it.id}"><div class="top"><button class="nm" data-a="e">${esc(it.name)}${it.qty<=0?'<small>LIPSĂ DIN STOC</small>':''}</button><div class="qv">${it.qty}</div></div><div class="btns">${[-10,-5,-1,1,5,10].map(d=>`<button class="b ${d>0?'p':'m'}" data-d="${d}">${d>0?'+':'−'}${Math.abs(d)}</button>`).join('')}</div><div class="man"><button class="b m" data-a="sub" style="flex:none;width:60px;font-size:24px">−</button><input class="q" type="number" inputmode="numeric" min="0" value=""><button class="b p" data-a="add" style="flex:none;width:60px;font-size:24px">+</button></div></div>`).join(''):'<div class="empty">Această secțiune este goală.<br>Apăsați „Adaugă produs”.</div>';
 }
}
function modal(html,bind){$('modal').innerHTML=`<div class="ov"><div class="md">${html}</div></div>`;bind(()=>$('modal').innerHTML='')}
function textModal(title,label,val,onSave,onDel){
 modal(`<h3>${title}</h3><label>${label}</label><input type="text" id="f0" value="${esc(val)}"><div class="row">${onDel?'<button class="del" id="mDel">Șterge</button>':''}<button id="mCan">Anulare</button><button class="ok" id="mOk">Salvează</button></div>`,close=>{
  $('mCan').onclick=close;
  $('mOk').onclick=()=>{const v=$('f0').value.trim();if(!v)return;onSave(v);close();save();render()};
  if(onDel)$('mDel').onclick=()=>{if(confirm('Ștergeți?')){onDel();close();save();render()}};
  setTimeout(()=>$('f0').focus(),50)});
}
function resize(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72))};im.onerror=()=>alert('Nu s-a putut deschide fotografia');im.src=r.result};r.readAsDataURL(file)}
function sectionModal(s){
 let photo=s?s.photo||'':'';
 modal(`<h3>${s?'Secțiune':'Secțiune nouă'}</h3><label>Denumire</label><input type="text" id="f0" value="${esc(s?s.name:'')}"><label>Fotografia secțiunii</label><div class="pv" id="pv"></div><input type="file" id="file" accept="image/*" style="display:none"><div class="row"><button id="pick">Alege foto</button><button id="rm">Elimină foto</button></div><div class="row">${s?'<button class="del" id="mDel">Șterge</button>':''}<button id="mCan">Anulare</button><button class="ok" id="mOk">Salvează</button></div>`,close=>{
  const pv=()=>{$('pv').style.backgroundImage=photo?`url(${photo})`:'none';$('pv').textContent=photo?'':'📁'};pv();
  $('pick').onclick=()=>$('file').click();
  $('file').onchange=e=>{const f=e.target.files[0];if(f)resize(f,d=>{photo=d;pv()})};
  $('rm').onclick=()=>{photo='';pv()};
  $('mCan').onclick=close;
  $('mOk').onclick=()=>{const v=$('f0').value.trim();if(!v)return;
   if(s){s.name=v;s.photo=photo}else S.sections.push({id:uid(),name:v,photo,items:[]});
   close();save();render()};
  if(s)$('mDel').onclick=()=>{if(confirm('Ștergeți secțiunea împreună cu toate produsele?')){S.sections=S.sections.filter(x=>x!==s);close();save();location.hash='';sec=null;render()}};
  setTimeout(()=>$('f0').focus(),50)});
}
$('add').onclick=()=>{
 if(!sec)sectionModal(null);
 else textModal('Produs nou','Denumire','',v=>{sec.items.push({id:uid(),name:v,qty:0})});
};
$('hd').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='back'){location.hash='';}
 if(b.id==='undo')undo();
 if(b.id==='secEdit')sectionModal(sec)};
$('main').onclick=e=>{
 if(!sec){const c=e.target.closest('.sc');if(c)location.hash='s-'+c.dataset.id;return}
 const card=e.target.closest('.item');if(!card)return;
 const it=sec.items.find(i=>i.id==card.dataset.id);if(!it)return;
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a==='add'||b.dataset.a==='sub'){const n=num(card.querySelector('.q').value,0);if(n)askQty(it,Math.max(0,it.qty+(b.dataset.a==='add'?n:-n)))}
 else if(b.dataset.d){askQty(it,Math.max(0,it.qty+parseInt(b.dataset.d,10)))}
 else if(b.dataset.a==='e')textModal('Produs','Denumire',it.name,v=>{it.name=v},()=>{sec.items=sec.items.filter(x=>x!==it)});
};
$('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('q')){const g=e.target.closest('.item').querySelector('[data-a=add]');if(g)g.click()}});
load();last=JSON.stringify(S);route();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
